<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Basic Meta Tags -->
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Website Title -->
    <title>NEXVISI - AI Landing Page</title>

    <!-- CSS File -->
    <link rel="stylesheet" href="Style.css">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    
</head>

<body>

    <!-- ========================= -->
    <!-- Main Container Starts -->
    <!-- ========================= -->

    <section class="hero">

        <!-- Background Overlay -->
        <div class="overlay"></div>

        <!-- ========================= -->
        <!-- Navigation Bar -->
        <!-- ========================= -->

        <header>

            <!-- Logo -->
            <div class="logo">
                NEXVISI
            </div>

            <!-- Navigation Menu -->
            <nav>

                <ul>

                    <li><a href="#">Home</a></li>

                    <li><a href="#">Service</a></li>

                    <li><a href="#">Feature</a></li>

                    <li><a href="#">Contact</a></li>

                </ul>

            </nav>

            <!-- Right Side Buttons -->
            <div class="nav-btn">

                <button class="language">
                    EN
                    <i class="fa-solid fa-angle-down"></i>
                </button>

                <button class="contact-btn">
                    Contact US
                    <i class="fa-regular fa-comment-dots"></i>
                </button>

            </div>

        </header>

        <!-- ========================= -->
        <!-- Hero Content -->
        <!-- ========================= -->

        <div class="hero-content">

            <!-- Left Side -->
            <div class="left">

                <!-- Small Tags -->
                <div class="tags">

                    <span>Insight Beyond</span>

                    <span>Intelligence</span>

                    <span>Secure AI</span>

                </div>

                <!-- Main Heading -->
                <h1>
                    Innovate
                    <br>
                    Without Limits
                </h1>

                <!-- Buttons -->
                <div class="buttons">

                    <button class="start-btn">

                        Get Started

                        <i class="fa-solid fa-arrow-up-right-from-square"></i>

                    </button>

                    <button class="play-btn">

                        <i class="fa-solid fa-play"></i>

                    </button>

                </div>

                <!-- Statistics -->
                <div class="stats">

                    <!-- Box 1 -->
                    <div class="stat-box">

                        <h2>320M+</h2>

                        <p>Business</p>

                    </div>

                    <!-- Box 2 -->
                    <div class="stat-box">

                        <h2>590K+</h2>

                        <p>Happy Client</p>

                    </div>

                    <!-- Box 3 -->
                    <div class="stat-box">

                        <h2>98%</h2>

                        <p>Success Rate</p>

                    </div>

                </div>

            </div>

            <!-- Right Side -->
            <div class="right">
                <!-- Floating Card -->
                <div class="glass-card">

                    <h3>Profit</h3>

                    <h2>68.5%</h2>

                    <div class="chart">

                        <div></div>
                        <div></div>
                        <div></div>
                        <div></div>
                        <div></div>
                        <div></div>

                    </div>

                </div>

                <!-- Bottom Text -->
                <div class="brand-info">

                    <h3>BRAND'S DIGITAL IDENTITY</h3>

                    <a href="#">
                        Explore More
                        <i class="fa-solid fa-circle-arrow-right"></i>
                    </a>

                </div>

            </div>

        </div>

    </section>

</body>

</html>
